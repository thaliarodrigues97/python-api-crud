apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api-crud
  labels:
    app: python-api-crud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-api-crud
  template:
    metadata:
      labels:
        app: python-api-crud
    spec:
      containers:
      - name: api
        image: python-api-crud:1.0.0
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
